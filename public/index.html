<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP Agro — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <div class="auth-bg">
    <div class="auth-brand">
      <div class="auth-logo">🌱</div>
      <h1>MVP Agro</h1>
      <p>Gestão inteligente do campo</p>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-box">
      <div id="toast" class="toast hidden"></div>

      <!-- Login -->
      <div id="loginView">
        <h2>Entrar</h2>
        <p class="auth-sub">Bem-vindo de volta ao seu painel agrícola</p>
        <form id="loginForm">
          <div class="field">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="seu@email.com" required />
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" name="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Entrar</button>
        </form>
        <p class="auth-switch">Não tem conta? <a href="#" id="goRegister">Cadastrar-se</a></p>
      </div>

      <!-- Register -->
      <div id="registerView" class="hidden">
        <h2>Criar conta</h2>
        <p class="auth-sub">Comece a gerenciar sua propriedade rural</p>
        <form id="registerForm">
          <div class="field">
            <label>Nome completo</label>
            <input type="text" name="name" placeholder="João Silva" required />
          </div>
          <div class="field">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="seu@email.com" required />
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Criar conta</button>
        </form>
        <p class="auth-switch">Já tem conta? <a href="#" id="goLogin">Entrar</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, register, getCurrentUser } from './service/api.js';

    if (getCurrentUser()) window.location.href = '/app.html';

    const loginView = document.getElementById('loginView');
    const registerView = document.getElementById('registerView');
    const toast = document.getElementById('toast');

    function showToast(msg, type = 'error') {
      toast.textContent = msg;
      toast.className = `toast toast-${type}`;
      setTimeout(() => toast.className = 'toast hidden', 4000);
    }

    document.getElementById('goRegister').addEventListener('click', e => {
      e.preventDefault();
      loginView.classList.add('hidden');
      registerView.classList.remove('hidden');
    });

    document.getElementById('goLogin').addEventListener('click', e => {
      e.preventDefault();
      registerView.classList.add('hidden');
      loginView.classList.remove('hidden');
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const fd = new FormData(e.target);
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        await login(fd.get('email'), fd.get('password'));
        window.location.href = '/app.html';
      } catch (err) {
        showToast(err.message);
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const fd = new FormData(e.target);
      btn.disabled = true; btn.textContent = 'Criando...';
      try {
        await register(fd.get('name'), fd.get('email'), fd.get('password'));
        showToast('Conta criada! Faça login.', 'success');
        registerView.classList.add('hidden');
        loginView.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Criar conta';
      } catch (err) {
        showToast(err.message);
        btn.disabled = false; btn.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
